# Fuzz targets for every decoder that sees untrusted bytes (stage 16). A
# workspace of its own, excluded from Norn's: libFuzzer is C++ and needs
# nightly, and keeping it here keeps it out of every shipped graph, which the
# deps gate holds free of C. Run with `just fuzz`; fuzz/seed writes the corpus.

[package]
name = "norn-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[workspace]
members = [".", "seed"]
resolver = "3"

[dependencies]
libfuzzer-sys = "0.4"
norn-core = { path = "../crates/core" }
norn-codec = { path = "../crates/codec" }
norn-storage = { path = "../crates/storage", features = ["fuzzing"] }
# `fuzzing` exposes each crate's file and request decoders, and nothing else.
norn-index = { path = "../crates/index", features = ["fuzzing"] }
norn-metadata = { path = "../crates/metadata", features = ["fuzzing"] }
norn-runtime = { path = "../crates/runtime", features = ["fuzzing"] }
norn-server = { path = "../crates/server", features = ["fuzzing"] }
norn-protocol = { path = "../crates/protocol" }
norn-query = { path = "../crates/query" }
norn-adapter = { path = "../adapters/contract" }
norn-adapter-csv = { path = "../adapters/csv" }
norn-adapter-parquet = { path = "../adapters/parquet" }
norn-adapter-mcap = { path = "../adapters/mcap" }
prost = "0.14"
bytes = "1"
tokio = { version = "1.54", default-features = false, features = ["rt", "time"] }

[[bin]]
name = "codec_timestamp"
path = "fuzz_targets/codec_timestamp.rs"
test = false
doc = false
bench = false

