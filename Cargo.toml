# Norn: a domain-independent temporal data engine. See docs/project/spec.md and docs/project/plan.md.
#
# Every crate under crates/ and adapters/ is a member by glob, so
# parallel work adds a crate without editing this file. Shared settings live
# here; the foundation piece owns changes to them.
#
# Every crate is AGPL-3.0-or-later, with a separate commercial licence (see
# README.md and LICENSE-COMMERCIAL.md). There is no permissive exception.
[workspace]
resolver = "3"
members = ["crates/*", "adapters/*", "xtask"]

[workspace.package]
license = "AGPL-3.0-or-later"
version = "1.0.0-rc.2"
edition = "2024"
# All crates build on Rust 1.99; rust-toolchain.toml pins the patch release.
rust-version = "1.99"
repository = "https://github.com/shokki-engineering/norn"

# Every third-party crate the workspace uses is declared once, here, with the
# reason it earns its place (SPEC §39).
[workspace.dependencies]
# Property tests for lossless round-trips (SPEC §36). Dev-only: no shipped
# crate links it.
proptest = { version = "1", default-features = false, features = ["std"] }
# xtask reads `cargo metadata` output; std has no JSON parser. The adapters also
# carry the entity and signal catalog in files as JSON, readable by any tool,
# and an MCP tool's arguments and results are JSON by the MCP standard.
serde_json = "1"

# --- Encoding (norn-codec).
# SPEC §14 decision: zstd from a pure-Rust encoder at levels 3-6, emitting
# standard frames. Pinned exactly: chosen after reading and measuring the
# candidates (docs/reference/storage.md "Block compression"). Default features off: no SIMD
# kernels beyond the scalar path, no dictionary builder, no legacy frames, no
# xxhash (storage checksums chunks itself), so no transitive crate.
structured-zstd = { version = "=0.2.6", default-features = false, features = ["std"] }

# --- Encryption at rest (norn-storage only); docs/reference/storage.md "Encryption".
# RustCrypto, pure Rust: no ring, no aws-lc, no C (SPEC §1). xtask/src/crypto.rs
# keeps them beneath norn-storage, and deny.toml lets only norn-storage name them.
# ChaCha20-Poly1305 (RFC 8439) is constant-time in software, so it needs no AES
# instructions to be safe or fast on ARMv7. Default features off: no `getrandom`
# feature of `aead` (randomness comes from `getrandom` below), no heapless.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
# HKDF-SHA-256 (RFC 5869): a per-segment key from the master key and the segment's salt.
hkdf = { version = "0.13", default-features = false }
# SHA-256 for HKDF; already in tpp-agents' graph.
sha2 = { version = "0.11", default-features = false }
# Wipes key material when a key is dropped.
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
# The OS random source for each segment's 24-byte salt. Already in the graph.
getrandom = { version = "0.4", default-features = false }

# --- The wire protocol (norn-protocol); docs/reference/protocol.md justifies each.
# Message encoding: the canonical protobuf runtime for Rust.
prost = { version = "0.14", default-features = false, features = ["std", "derive"] }
# google.protobuf well-known types (Timestamp, Duration, FieldMask, Empty).
prost-types = { version = "0.14", default-features = false, features = ["std"] }
# gRPC (SPEC §8). No default features: each crate enables only what it uses
# (`codegen` for the stubs, `transport` and `router` for serving).
tonic = { version = "0.14", default-features = false }
# The prost codec the generated tonic stubs use.
tonic-prost = { version = "0.14", default-features = false }
# google.rpc.Status and ErrorInfo (AIP-193) inside a tonic::Status.
tonic-types = { version = "0.14", default-features = false }
# The standard grpc.health.v1 service: docs/reference/protocol.md makes health that, not a
# Norn method.
tonic-health = { version = "0.14", default-features = false }
# Standard schema discovery over owner-only IPC, including v1alpha for Postman.
# Already in runtime-rs's graph; adds no new transitive dependency.
tonic-reflection = { version = "0.14", default-features = false }

# --- Async runtime and IPC (norn-transport, norn-ipc, the daemon); docs/reference/ipc.md.
# The runtime tonic requires; also Unix sockets, named pipes and signals.
# No default features: each crate enables what it uses.
tokio = { version = "1.54", default-features = false }
# CancellationToken for shutdown and abort; already in tonic's graph.
tokio-util = { version = "0.7", default-features = false }
# hyper-util, tower, http, http-body, bytes, futures-core: the types tonic's
# custom-connector and custom-incoming hooks require; all already in tonic's
# graph, so naming them adds nothing to the build.
hyper-util = { version = "0.1", default-features = false }
tower = { version = "0.5", default-features = false }
http = "1"
http-body = "1"
bytes = "1"
futures-core = "0.3"
# Windows only: the owner-only security descriptor for named pipes, which
# std and tokio cannot build safely. Already in tokio's graph.
windows-sys = { version = "0.61", default-features = false }

# --- The shared-memory data plane (norn-shared-memory); docs/reference/shared-memory.md.
# iceoryx2: the owner's choice (2026-11-03) over a hand-written ring. Pinned
# exactly: pre-1.0, and the layout of its shared segments may change between
# releases, so client and daemon must agree. Default features stay on: without
# `std` its IPC service is unavailable; its console logger is silenced at
# startup. Its platform crates name `cc` and `bindgen` as build dependencies,
# used only when compiling for QNX: xtask/src/iceoryx2.rs audits and confines
# that. One dependency is 0BSD (deny.toml).
iceoryx2 = "=0.10.0"

# --- The daemon (norn-server) and nornctl.
# Structured logging (SPEC §34): the standard facade, already in tonic's graph.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Formats and filters tracing events onto stderr as text or JSON lines.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }
# Typed reading of the daemon's TOML configuration file.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
# The TOML parser: pure Rust, the format Cargo itself uses.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

# --- Interchange formats (adapters/); docs/reference/adapters.md justifies each.
# Parquet (SPEC §12, §44). No default features: `snap` is the only codec, pure
# Rust; `zstd` is the C library, so it stays off.
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
# In-memory columns, and the Arrow IPC file format (SPEC §44). All already in
# parquet's graph; no IPC compression features (lz4, zstd).
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
arrow-ipc = { version = "60", default-features = false }
# MCAP for Foxglove and Lichtblick. No default features: its zstd and lz4 are C.
mcap = { version = "0.26", default-features = false }
# Row-group digests: Parquet and Arrow IPC writers store no data checksum, and
# SPEC §20 will not silently accept damage. Already in mcap's graph.
crc32fast = "1"

# --- MCP inside the daemon (norn-server); docs/reference/mcp.md.
# The Model Context Protocol, the SDK protoc-gen-mcp's Rust output and
# tpp-agents are written against. No default features: none brings TLS.
rmcp = { version = "3.8", default-features = false }

# --- The daemon's servers (norn-server); docs/reference/architecture.md, "runtime-rs".
# runtime-rs's HybridServer: gRPC on a local socket or named pipe (never a TCP
# port unless configured), its connection limits and drain, server reflection,
# and the MCP runtime beside it, in-process. Default features off: no HTTP/3
# (QUIC), no A2A (reqwest, aws-lc) and no `tls` (tonic's `tls-ring`), so no
# C. It records spans through OpenTelemetry; xtask's deps gate excuses that
# beneath norn-server only (xtask/src/runtime_rs.rs). Apache-2.0,
# compatible with Norn's AGPL. `tpp_grpc` because its library is named `grpc`.
tpp_grpc = { package = "tpp-grpc", git = "https://github.com/the-protobuf-project/runtime-rs", rev = "03a8899b728c6025da902501ac041eb03c94e684", default-features = false }
# MCP's transports (stdio, streamable HTTP on loopback TCP or a local socket)
# and the vocabulary protoc-gen-mcp's Rust output is written against.
tpp-agents = { git = "https://github.com/the-protobuf-project/runtime-rs", rev = "03a8899b728c6025da902501ac041eb03c94e684", default-features = false, features = ["mcp"] }
# The generated MCP handlers' traits are async-trait's. Already in tonic's graph.
async-trait = "0.1"
# The generated handlers name axum for an HTTP transport Norn does not use;
# already in tonic's graph (its `router` feature).
axum = { version = "0.8", default-features = false }
# A tool's arguments are its RPC's request as protobuf JSON; prost-reflect maps
# JSON to and from the message by its descriptor. Already in tpp-grpc's graph.
prost-reflect = { version = "0.16", default-features = false, features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
dbg_macro = "deny"
