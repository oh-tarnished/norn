<svg xmlns="http://www.w3.org/2000/svg" width="324" height="156" viewBox="0 0 324 156" role="img" aria-label="nornctl streams">
<rect width="324" height="156" rx="8" fill="#0d1117"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
<text x="16" y="24" fill="#8b949e">nornctl streams</text>
<text x="16" y="60" fill="#7ee787">$ nornctl streams</text>
<text x="16" y="80" fill="#e6edf3">streams/plant samples=3 buffered=3</text>
<text x="16" y="100" fill="#7ee787">$ sleep 61</text>
<text x="16" y="120" fill="#7ee787">$ nornctl streams</text>
<text x="16" y="140" fill="#e6edf3">streams/plant samples=3</text>
</g>
</svg>
