[package]
name = "norn-storage"
description = "Norn's native on-disk format: segments of checksummed, independently recoverable chunks."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Exposes the chunk decoder and frame encoder to the fuzz crate (fuzz/), and to
# nothing else: no shipped build enables it.
[features]
fuzzing = []

[lints]
workspace = true

# CRC32C is implemented in `src/crc32c.rs` (about 40 lines, table-driven, no
# unsafe), and file I/O is std. See docs/reference/storage.md "Checksums" for
# why CRC32C over xxHash64. The only third-party crates are the RustCrypto ones
# opt-in encryption at rest needs (docs/reference/storage.md "Encryption").
[dependencies]
norn-core = { path = "../core" }
norn-codec = { path = "../codec" }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "encryption"
harness = false
