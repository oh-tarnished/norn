[package]
name = "norn-protocol"
description = "Norn's public wire protocol: Rust types and gRPC stubs generated from protobuf/."
version.workspace = true
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# Each dependency is what the committed generated code names, at the
# versions protoc-gen-prost 0.5 and protoc-gen-tonic 0.5 emit for; the root
# Cargo.toml says why each earns its place. All are pure Rust.
[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
# Only `codegen`: no transport, no TLS, no router. The transport is
# crates/transport's (SPEC section 7), so the protocol stays independent of
# how bytes move.
tonic = { workspace = true, features = ["codegen"] }
tonic-prost = { workspace = true }
# buf.gen.yaml maps .google.rpc here.
tonic-types = { workspace = true }

[lints]
workspace = true
