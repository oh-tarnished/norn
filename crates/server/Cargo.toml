[package]
name = "norn-server"
description = "The Norn daemon: configuration, AdminService and health over local IPC."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "norn"
path = "src/main.rs"

# Each third-party crate is declared, with its reason, in the root Cargo.toml.
[dependencies]
norn-core = { path = "../core" }
norn-protocol = { path = "../protocol" }
norn-ipc = { path = "../ipc" }
norn-runtime = { path = "../runtime" }
norn-metadata = { path = "../metadata" }
# The iceoryx2 data plane, offered only when `[shared_memory] enabled = true`.
norn-shared-memory = { path = "../shared-memory" }
# Serving: generated service servers, the router, and Status.
tonic = { workspace = true, features = ["codegen", "router", "transport"] }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true, features = ["server"] }
# google.protobuf.Timestamp and Duration in the Server resource.
prost-types = { workspace = true }
# Reading the google.rpc.Status a tonic error carries into a SampleError.
prost = { workspace = true }
# Reading gRPC frames as they arrive, to reserve before decoding (metered.rs).
http-body = { workspace = true }
bytes = { workspace = true }
# The tokio runtime the daemon runs on, and SIGINT/SIGTERM (Ctrl-C on Windows).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
# TaskTracker (`rt`): the tasks calls spawn, which shutdown waits for.
tokio-util = { workspace = true, features = ["rt"] }
# The UNIMPLEMENTED stub services are plain tower services over http types.
tower = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
# Text or JSON lines on stderr; `json` for machine-read logs.
tracing-subscriber = { workspace = true, features = ["json"] }
serde = { workspace = true }
toml = { workspace = true }
# The server: gRPC on a local socket or pipe through runtime-rs's HybridServer,
# and MCP inside it (docs/reference/mcp.md). See the root Cargo.toml for each.
tpp_grpc = { workspace = true }
tpp-agents = { workspace = true }
rmcp = { workspace = true, features = ["server"] }
async-trait = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
prost-reflect = { workspace = true }

# Exposes the request decoding path to the fuzz crate (fuzz/), and to nothing
# else: no shipped build enables it.
[features]
fuzzing = []

[dev-dependencies]
# Tests read back what the daemon stored; a client never does this.
norn-storage = { path = "../storage" }
norn-core = { path = "../core" }
# A query's answer is the same before and after compaction, on generated data.
proptest = { workspace = true }
# Real MCP clients against the real `norn` binary, over stdio and a Unix socket.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-unix-socket"] }
tokio = { workspace = true, features = ["process", "io-util"] }

# A crash test's writer stops halfway through a frame, which the client's
# Producer never lets it do; so it publishes through iceoryx2 directly. Unix
# only, like the rings.
[target.'cfg(unix)'.dev-dependencies]
iceoryx2 = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "append"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "state"
harness = false

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "provision"
harness = false

[[bench]]
name = "shared_memory"
harness = false
