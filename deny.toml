# cargo-deny: licences, advisories, bans and sources across the whole graph.
# `just deny` runs it locally; CI runs it on every change.

[graph]
all-features = true

[advisories]
# Every advisory fails unless ignored here with a reason.
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained, with no fix to take. A macro used only while
    # compiling mcap (0.26 is the newest): nothing of it runs or ships.
    { id = "RUSTSEC-2024-0436", reason = "compile-time macro of mcap; nothing of it ships" },
    # rustls-pemfile is unmaintained (its parsers moved into rustls-pki-types).
    # tpp-grpc reads a certificate with it only in with_certificates, which norn
    # never calls: the daemon listens on a local endpoint without TLS.
    { id = "RUSTSEC-2025-0134", reason = "tpp-grpc's certificate loading; norn configures no TLS" },
]

[licenses]
version = 2
# Permissive licences only (the brief): anything else is an explicit decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # owner decision 2026-11-03: 0BSD (more permissive than MIT) for iceoryx2's
    # dependency. Zero-clause BSD keeps no conditions at all, so it is compatible
    # with the AGPL and the commercial licence.
    "0BSD",
]
confidence-threshold = 0.9
# The allow-list is policy, not inventory: a licence not yet in the graph is
# still allowed.
unused-allowed-license = "allow"

# CC0-1.0 is a public-domain dedication, compatible with the AGPL and the
# commercial licence. Only this crate: it is a build-time hash in const-random's
# proc macro, under ahash under arrow, and none of it is linked into a binary.
#
# MIT-0 is MIT without the attribution clause: more permissive than MIT. Only
# borrow-or-share, through prost-protovalidate -> fluent-uri under tpp-grpc's
# request validation, which norn-server links.
exceptions = [
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    { crate = "borrow-or-share", allow = ["MIT-0"] },
]

[licenses.private]
# This allow-list governs third-party dependencies. Norn's unpublished
# crates are all AGPL-3.0-or-later with a commercial option (README.md).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Encryption's cipher and key derivation: named by norn-storage alone
# (xtask/src/crypto.rs holds the same line, with sha2, zeroize and getrandom).
deny = [
    { crate = "chacha20poly1305", wrappers = ["norn-storage"] },
    { crate = "hkdf", wrappers = ["norn-storage"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# runtime-rs (tpp-grpc, tpp-agents: the daemon's HybridServer and MCP), and
# the HTTP transcoder it is built with, pinned by runtime-rs to a tag. Apache-2.0.
allow-git = [
    "https://github.com/the-protobuf-project/runtime-rs",
    "https://github.com/the-protobuf-project/http",
]
