# cargo-deny: licences, advisories, bans and sources across the whole graph.
# `just deny` runs it locally; CI runs it on every change.

[graph]
all-features = true

[advisories]
# Every advisory fails unless ignored here with a reason.
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained, with no fix to take. A macro used only while
    # compiling mcap (0.26 is the newest): nothing of it runs or ships.
    { id = "RUSTSEC-2024-0436", reason = "compile-time macro of mcap; nothing of it ships" },
]

[licenses]
version = 2
# Permissive licences only (the brief): anything else is an explicit decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# The allow-list is policy, not inventory: a licence not yet in the graph is
# still allowed.
unused-allowed-license = "allow"

# CC0-1.0 is a public-domain dedication, compatible with the AGPL and the
# commercial licence. Only this crate: it is a build-time hash in const-random's
# proc macro, under ahash under arrow, and none of it is linked into a binary.
exceptions = [{ crate = "tiny-keccak", allow = ["CC0-1.0"] }]

[licenses.private]
# This allow-list governs third-party dependencies. Norn's unpublished
# crates are all AGPL-3.0-or-later with a commercial option (README.md).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
