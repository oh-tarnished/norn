# A vX.Y.Z tag, or a manual run, packages Norn's daemon, CLI and MCP server.
# Cargo crates remain unpublished; releases distribute the binaries.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      title: ${{ steps.plan.outputs.title }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: extractions/setup-just@v4
      - name: Check tag and workspace versions
        id: plan
        run: just release-plan
      - run: just gates

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # runtime-rs's validation types are generated at build time.
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ github.token }}
      - run: just release-build "$TARGET"
      - run: just release-package "$TARGET" "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: norn-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish ${{ needs.plan.outputs.tag }}
    needs: [plan, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      TITLE: ${{ needs.plan.outputs.title }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish archives and SHA-256 checksums
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file .github/release/norn.md \
            --generate-notes "${flags[@]}"
