# Each job reports independently so one failure does not hide the others.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  conformance:
    name: Conformance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check root license files
        run: bash .github/release/test-licenses.sh --self-test
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
      - run: just gates
      - run: bash .github/release/test-formula.sh

  test:
    name: Build, lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
      # Norn's generated sources are committed, but runtime-rs's
      # prost-protovalidate-types dependency still needs the host protoc.
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ github.token }}
      - run: just build
      - run: just lint
      - run: just test
      - run: just bench-smoke
      - run: just doc

  # Separate from `test` so a failure names the kind of bug, and a hang is bounded.
  e2e:
    name: End-to-end, daemon and nornctl (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ github.token }}
      - run: just e2e

  crash:
    name: Crash and corruption (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ github.token }}
      - run: just crash

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: extractions/setup-just@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: just deny

  cross:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [armv7-unknown-linux-gnueabihf, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Build scripts run on the host, even when checking an ARM target.
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ github.token }}
      - run: just cross "${{ matrix.target }}"
