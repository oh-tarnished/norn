syntax = "proto3";

package norn.admin.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";

option java_multiple_files = true;
option java_outer_classname = "LimitsProto";
option java_package = "local.norn.admin.v1";

// The bounds the daemon enforces, published so clients size their work to
// fit instead of discovering the bounds by failure (SPEC sections 16 and
// 41). Exceeding one fails with ERROR_REASON_LIMIT_EXCEEDED or
// ERROR_REASON_CAPACITY_EXHAUSTED.
message Limits {
  // The most samples in one AppendSamplesRequest.
  int32 max_batch_samples = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The largest AppendSamplesRequest, in encoded bytes: the limit on every
  // message an AppendSamples call sends, checked as each one arrives.
  int64 max_batch_bytes = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The most batches one AppendSamples call may have unacknowledged at
  // the level it asked for.
  int32 max_pending_batches = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The most streams the daemon holds.
  int32 max_streams = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The most replay sessions that may exist at once.
  int32 max_replay_sessions = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The most SubscribeEvents calls open at once.
  int32 max_subscriptions = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How long a replay session may sit idle before the daemon deletes it.
  google.protobuf.Duration replay_session_idle_timeout = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The largest request message of every method but AppendSamples, in
  // encoded bytes: each unary request, and each message a client sends on a
  // streaming call such as DriveReplaySession. Size a BatchCreateEntities or
  // BatchCreateSignals request by its encoded length, not its entry count.
  // Added in 1.8; a daemon before 1.8 leaves it zero and enforces 262144.
  int64 max_message_bytes = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The most requests in one BatchCreateEntities or BatchCreateSignals call.
  // The request must also fit `max_message_bytes`. Added in 1.8; a daemon
  // before 1.8 leaves it zero and enforces 1000.
  int32 max_batch_create_requests = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}
