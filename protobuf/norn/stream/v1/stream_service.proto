syntax = "proto3";

package norn.stream.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";
import "mcp/v1/annotations.proto";
import "norn/stream/v1/stream.proto";
import "norn/stream/v1/stream_maintenance.proto";
import "norn/stream/v1/stream_messages.proto";
import "norn/stream/v1/stream_operations.proto";
import "norn/stream/v1/stream_segment.proto";
import "norn/stream/v1/stream_segment_messages.proto";

option java_multiple_files = true;
option java_outer_classname = "StreamServiceProto";
option java_package = "local.norn.stream.v1";

// StreamService manages streams and the long-running work done on their
// stored history: compaction, verification, retention and export. Those return a
// google.longrunning.Operation, polled through the google.longrunning.
// Operations service the daemon also serves.
service StreamService {
  // The default host; see norn.entity.v1.EntityService.
  option (google.api.default_host) = "norn.local";

  // A stream's totals change with every sample: no client may share or
  // reuse an answer.
  option (mcp.v1.service) = {
    cache: {scope: MCP_CACHE_SCOPE_PRIVATE}
  };

  // Creates a stream.
  rpc CreateStream(CreateStreamRequest) returns (Stream) {
    option (google.api.http) = {
      post: "/v1/streams"
      body: "stream"
    };
    option (google.api.method_signature) = "stream,stream_id";
  }

  // Reads one stream, with its current totals.
  rpc GetStream(GetStreamRequest) returns (Stream) {
    option (mcp.v1.tool) = {
      title: "Get stream"
      read_only: true
      open_world: false
    };
    option (google.api.http) = {get: "/v1/{name=streams/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists streams in name order.
  rpc ListStreams(ListStreamsRequest) returns (ListStreamsResponse) {
    option (mcp.v1.tool) = {
      title: "List streams"
      read_only: true
      open_world: false
    };
    option (google.api.http) = {get: "/v1/streams"};
    option (google.api.method_signature) = "";
  }

  // Reads one segment file of a stream: its chunks, samples, size and span,
  // and with SEGMENT_VIEW_FULL its encodings. Changes nothing. Since 1.8.
  rpc GetSegment(GetSegmentRequest) returns (Segment) {
    option (google.api.http) = {get: "/v1/{name=streams/*/segments/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a stream's segment files, sealed and open, in name order: how its
  // history sits on disk. Changes nothing. Since 1.8.
  rpc ListSegments(ListSegmentsRequest) returns (ListSegmentsResponse) {
    option (google.api.http) = {get: "/v1/{parent=streams/*}/segments"};
    option (google.api.method_signature) = "parent";
  }

  // Changes the fields named in `update_mask`. Tightening `retention` takes
  // effect at the next retention pass, never inside this call.
  rpc UpdateStream(UpdateStreamRequest) returns (Stream) {
    option (google.api.http) = {
      patch: "/v1/{stream.name=streams/*}"
      body: "stream"
    };
    option (google.api.method_signature) = "stream,update_mask";
  }

  // Deletes a stream that no signal records into and that holds no
  // samples; FAILED_PRECONDITION with ERROR_REASON_RESOURCE_NOT_EMPTY
  // otherwise.
  rpc DeleteStream(DeleteStreamRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=streams/*}"};
    option (google.api.method_signature) = "name";
  }

  // Merges small chunks, re-chooses encodings and rebuilds the index for a
  // stream's history (SPEC section 42). Crash-safe and lossless: every
  // sample readable before is readable after, bit for bit. Ingestion
  // continues meanwhile.
  rpc CompactStream(CompactStreamRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=streams/*}:compact"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "CompactStreamResponse"
      metadata_type: "CompactStreamMetadata"
    };
  }

  // Reads and checks every chunk of a stream's sealed segments, through
  // whatever startup skipped. Changes no stored byte. Damage found is reported
  // in the result and counted in the stream's `corrupt_sample_count`.
  rpc VerifyStream(VerifyStreamRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=streams/*}:verify"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "VerifyStreamResponse"
      metadata_type: "VerifyStreamMetadata"
    };
  }

  // Runs the stream's retention policy now rather than at the next pass (SPEC
  // section 43). With `validate_only`, removes nothing and says what would go.
  rpc ApplyStreamRetention(ApplyStreamRetentionRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=streams/*}:applyRetention"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "ApplyStreamRetentionResponse"
      metadata_type: "ApplyStreamRetentionMetadata"
    };
  }

  // Writes a stream's samples in an interval to a file in an interchange
  // format (SPEC section 44), streaming and in bounded memory.
  rpc ExportStream(ExportStreamRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=streams/*}:export"
      body: "*"
    };
    option (google.api.method_signature) = "name,output_uri,format";
    option (google.longrunning.operation_info) = {
      response_type: "ExportStreamResponse"
      metadata_type: "ExportStreamMetadata"
    };
  }
}
