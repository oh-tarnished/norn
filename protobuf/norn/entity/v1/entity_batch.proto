syntax = "proto3";

package norn.entity.v1;

import "google/api/field_behavior.proto";
import "norn/entity/v1/entity.proto";
import "norn/entity/v1/entity_messages.proto";

option java_multiple_files = true;
option java_outer_classname = "EntityBatchProto";
option java_package = "local.norn.entity.v1";

// The request for EntityService.BatchCreateEntities (AIP-233). Entities are
// top-level resources, so there is no parent.
//
// At most norn.admin.v1.Limits `max_batch_create_requests` (1000), or fails
// with INVALID_ARGUMENT naming `requests`; and the whole encoded message at
// most `max_message_bytes` (256 KiB), or fails with RESOURCE_EXHAUSTED and
// ERROR_REASON_LIMIT_EXCEEDED before it is decoded. The bound keeps one batch's
// memory, the time it holds the catalogue's lock, and recovery's work bounded.
message BatchCreateEntitiesRequest {
  // The entities to create, one CreateEntityRequest each, 1 to 1000 of them.
  // A request's own `validate_only` must be unset; set the batch's instead.
  repeated CreateEntityRequest requests = 1 [(google.api.field_behavior) = REQUIRED];

  // Validate the whole batch and return what would be created, storing
  // nothing.
  bool validate_only = 2 [(google.api.field_behavior) = OPTIONAL];
}

// The response for EntityService.BatchCreateEntities.
message BatchCreateEntitiesResponse {
  // One entity per request, in request order: the new entity, or the stored
  // one when it already existed.
  repeated Entity entities = 1;
}
