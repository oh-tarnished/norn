syntax = "proto3";

package norn.entity.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "mcp/v1/annotations.proto";
import "norn/entity/v1/entity.proto";
import "norn/entity/v1/entity_batch.proto";
import "norn/entity/v1/entity_messages.proto";

option java_multiple_files = true;
option java_outer_classname = "EntityServiceProto";
option java_package = "local.norn.entity.v1";

// EntityService keeps the catalogue of entities. It holds metadata only:
// observations are written through norn.telemetry.v1.TelemetryService and
// read through norn.query.v1.QueryService.
service EntityService {
  // The default host. Norn is reached over local IPC, so this names the
  // service rather than a network address.
  option (google.api.default_host) = "norn.local";

  // The catalogue changes as clients create and update entities: no client
  // may share or reuse an answer.
  option (mcp.v1.service) = {
    cache: {scope: MCP_CACHE_SCOPE_PRIVATE}
  };

  // Creates an entity. ALREADY_EXISTS if the name is taken.
  rpc CreateEntity(CreateEntityRequest) returns (Entity) {
    option (google.api.http) = {
      post: "/v1/entities"
      body: "entity"
    };
    option (google.api.method_signature) = "entity,entity_id";
  }

  // Creates up to 1000 entities in one call, all or none (AIP-233), with one
  // durable registry commit for the whole batch.
  //
  // Safe to repeat: an entity that already exists is returned as stored, its
  // fields left alone, so a client may send its whole catalogue at every
  // start.
  //
  // It writes, so it is no MCP tool: the hints below say so, and the daemon
  // serves only tools hinted read-only.
  rpc BatchCreateEntities(BatchCreateEntitiesRequest) returns (BatchCreateEntitiesResponse) {
    option (mcp.v1.tool) = {
      title: "Batch create entities"
      read_only: false
      destructive: false
      idempotent: true
      open_world: false
    };
    option (google.api.http) = {
      post: "/v1/entities:batchCreate"
      body: "*"
    };
  }

  // Reads one entity.
  rpc GetEntity(GetEntityRequest) returns (Entity) {
    option (mcp.v1.tool) = {
      title: "Get entity"
      read_only: true
      open_world: false
    };
    option (google.api.http) = {get: "/v1/{name=entities/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists entities in name order.
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse) {
    option (mcp.v1.tool) = {
      title: "List entities"
      read_only: true
      open_world: false
    };
    option (google.api.http) = {get: "/v1/entities"};
    option (google.api.method_signature) = "";
  }

  // Changes the fields named in `update_mask`.
  rpc UpdateEntity(UpdateEntityRequest) returns (Entity) {
    option (google.api.http) = {
      patch: "/v1/{entity.name=entities/*}"
      body: "entity"
    };
    option (google.api.method_signature) = "entity,update_mask";
  }

  // Deletes an entity that has no signals. FAILED_PRECONDITION with
  // ERROR_REASON_RESOURCE_NOT_EMPTY otherwise: deleting an entity never
  // deletes history as a side effect.
  rpc DeleteEntity(DeleteEntityRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=entities/*}"};
    option (google.api.method_signature) = "name";
  }
}
