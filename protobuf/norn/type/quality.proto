syntax = "proto3";

package norn.type;

import "google/api/field_behavior.proto";

option java_multiple_files = true;
option java_outer_classname = "QualityProto";
option java_package = "local.norn.type";

// How far the source trusts an observed value: a coarse severity and the
// reason for it. Norn stores quality beside the value and filters on it, but
// never alters a value because of it: a BAD sample is still history.
//
// Any substatus may pair with any severity; the pairing is the writer's
// judgement, since an overridden value is GOOD to one source and UNCERTAIN to
// another. New substatuses may arrive in a minor version; a reader treats an
// unknown one as QUALITY_SUBSTATUS_UNSPECIFIED and keeps the number.
message Quality {
  // The coarse trust level.
  QualitySeverity severity = 1 [(google.api.field_behavior) = REQUIRED];

  // Why the sample has that severity. Unset means no further detail.
  QualitySubstatus substatus = 2 [(google.api.field_behavior) = OPTIONAL];
}

// The coarse trust level of a sample.
enum QualitySeverity {
  // Not set. Rejected on ingestion: a source that does not know says
  // UNCERTAIN.
  QUALITY_SEVERITY_UNSPECIFIED = 0;
  // The value is what the source measured, and the source vouches for it.
  QUALITY_SEVERITY_GOOD = 1;
  // The value is usable but qualified: stale, estimated or substituted.
  QUALITY_SEVERITY_UNCERTAIN = 2;
  // The value must not be used as a measurement.
  QUALITY_SEVERITY_BAD = 3;
}

// Why a sample has the severity it has.
enum QualitySubstatus {
  // No further detail. Zero, so an unset substatus means none.
  QUALITY_SUBSTATUS_UNSPECIFIED = 0;
  // The source could not be reached; the value is the last one received.
  QUALITY_SUBSTATUS_LAST_KNOWN_VALUE = 1;
  // The source has not updated within its expected interval.
  QUALITY_SUBSTATUS_STALE = 2;
  // The value was entered or substituted by an operator.
  QUALITY_SUBSTATUS_SUBSTITUTED = 3;
  // The source reports its output is overridden.
  QUALITY_SUBSTATUS_OVERRIDDEN = 4;
  // The value was estimated or interpolated rather than measured.
  QUALITY_SUBSTATUS_ESTIMATED = 5;
  // The source is deliberately out of service.
  QUALITY_SUBSTATUS_OUT_OF_SERVICE = 6;
  // Communication with the source failed.
  QUALITY_SUBSTATUS_COMMUNICATION_FAILURE = 7;
  // The source device reports a fault.
  QUALITY_SUBSTATUS_DEVICE_FAILURE = 8;
  // The sensing element reports a fault.
  QUALITY_SUBSTATUS_SENSOR_FAILURE = 9;
  // The value lies outside the source's measurable range.
  QUALITY_SUBSTATUS_OUT_OF_RANGE = 10;
  // The source or its mapping is misconfigured.
  QUALITY_SUBSTATUS_CONFIG_ERROR = 11;
}
