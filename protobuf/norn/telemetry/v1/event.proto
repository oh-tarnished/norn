syntax = "proto3";

package norn.telemetry.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "norn/type/sample.proto";

option java_multiple_files = true;
option java_outer_classname = "EventProto";
option java_package = "local.norn.telemetry.v1";

// The request for TelemetryService.SubscribeEvents.
message SubscribeEventsRequest {
  // Whether to follow live ingestion or a replay session.
  SubscriptionMode mode = 1 [(google.api.field_behavior) = REQUIRED];

  // LIVE only: whose signals to follow, as `entities/{entity}`, or
  // `entities/-` for every entity. Must be empty for REPLAY.
  string parent = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {child_type: "norn.local/Signal"}
  ];

  // LIVE only: an AIP-160 filter selecting signals, as in ListSignals.
  // Must be empty for REPLAY, whose session fixes its own selection.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // REPLAY only: the session to follow, as
  // `replaySessions/{replay_session}`. Must be empty for LIVE.
  string replay_session = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "norn.local/ReplaySession"}
  ];
}

// One message on a SubscribeEvents stream: the events ready when it was
// sent, so a busy subscription pays the per-message cost once per batch
// rather than once per sample.
message SubscribeEventsResponse {
  // The events, in subscription order, `event_sequence` increasing by one.
  // Never empty.
  repeated Event events = 1;
}

// One event on a subscription. Live and replayed telemetry share this one
// message (SPEC section 27), so a consumer written against live data runs
// unchanged against history.
message Event {
  // The mode of the subscription that produced the event.
  SubscriptionMode mode = 1;

  // The event's position in its subscription: 1 for the first, then
  // increasing by exactly one. A gap would mean a lost event, which Norn
  // never allows; a subscriber that falls behind is disconnected instead.
  int64 event_sequence = 2;

  // The clock reading when the event was emitted: the daemon's wall clock
  // for LIVE, the session's virtual clock for REPLAY.
  google.protobuf.Timestamp clock_time = 3;

  // What happened.
  oneof payload {
    // An observation, exactly as it was ingested.
    norn.type.Sample sample = 4;
    // A change to the clock driving the subscription.
    ClockEvent clock_event = 5;
    // REPLAY only: what one signal held just before a seek's target, sent
    // right after the CLOCK_EVENT_KIND_SEEKED event, once for each selected
    // signal that had a sample by then (SPEC section 23). Folding a
    // subscription's samples and state samples, keeping each signal's last,
    // gives the state at the session's clock across seeks. Added in 1.3.
    norn.type.Sample state_sample = 6;
  }
}

// A change to a replay session's virtual clock, delivered in order with the
// samples, so a consumer knows that the next sample follows a seek rather
// than a quiet period. Live subscriptions never carry one.
message ClockEvent {
  // What changed.
  ClockEventKind kind = 1;
}

// Which source a subscription follows.
enum SubscriptionMode {
  // Not set. Rejected.
  SUBSCRIPTION_MODE_UNSPECIFIED = 0;
  // Samples as they are ingested, from the moment of subscription.
  SUBSCRIPTION_MODE_LIVE = 1;
  // Samples as a replay session's virtual clock reaches them.
  SUBSCRIPTION_MODE_REPLAY = 2;
}

// The kinds of change to a virtual clock.
enum ClockEventKind {
  // Not set. Never sent.
  CLOCK_EVENT_KIND_UNSPECIFIED = 0;
  // The clock started or resumed advancing.
  CLOCK_EVENT_KIND_RUNNING = 1;
  // The clock was paused.
  CLOCK_EVENT_KIND_PAUSED = 2;
  // The clock jumped; samples before the jump will not be followed by the
  // samples between the old and new times.
  CLOCK_EVENT_KIND_SEEKED = 3;
  // The playback speed changed.
  CLOCK_EVENT_KIND_SPEED_CHANGED = 4;
  // The clock reached the end of the session's interval. No sample follows
  // unless the session is sought back.
  CLOCK_EVENT_KIND_ENDED = 5;
  // The session was stopped. The subscription ends after this event.
  CLOCK_EVENT_KIND_STOPPED = 6;
}
